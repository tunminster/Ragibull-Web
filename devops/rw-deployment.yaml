apiVersion: apps/v1
kind: Deployment
metadata:
  name: rw-deployment
spec:
  selector:
    matchLabels:
      app: rw-app
  replicas: 3    
  template:
    metadata:
      labels:
        app: rw-app
    spec:
      containers:
      - name: rw-app
        image: #{repository-image}#
        resources:
          limits:
            memory: "64Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        env:
        - name: "ASPNETCORE_ENVIRONMENT"
          value: #{env-name}#
        volumeMounts:
          - name: secrets
            mountPath: /app/secrets
            readOnly: true
      imagePullSecrets:
        - name: #{acr-secret-name}#
      volumes:
        - name: secrets
          secret:
              secretName: #{appsettings-secret-name}#

---
apiVersion: v1
kind: Service
metadata:
  name: rw-service
spec:
  selector:
    app: rw-app
  ports:
  - port: 80
    targetPort: 80


---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/from-to-www-redirect: 'true'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($host = '' ) {
        rewrite ^ https://www.$request_uri permanent;
      }  
  name:  rw-ingress
  namespace: #{env-namespace}#
spec:
  tls:
  - hosts:
    - ragibull.com
    - www.ragibull.com
    secretName: rw-ingress-tls
  rules:
    - host: #{host-url}#
      http:
        paths:  
        - backend:
            serviceName:  rw-service
            servicePort: 80
          path: /
